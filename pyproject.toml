[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nippon-signal"
version = "0.1.0"
description = "Japan-to-Taiwan technology signal intelligence baseline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "requests>=2.32.0",
  "python-dateutil>=2.9.0",
  "PyYAML>=6.0.2",
  "typer>=0.12.5",
  "rich>=13.9.0",
  "streamlit>=1.39.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.6.0"]

[project.scripts]
nippon-signal = "nippon_signal.cli:app"

[tool.setuptools.packages.find]
include = ["nippon_signal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
